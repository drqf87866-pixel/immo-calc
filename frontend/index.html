<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Immo-Calc</title>
<meta name="theme-color" content="#0B0D12" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topnav">
  <div class="topnav-marke">
    <span class="topnav-logo">I</span>
    <span class="topnav-name">Immo-Calc</span>
  </div>
  <nav class="topnav-tabs">
    <button type="button" class="nav-tab" data-ansicht="rechner" onclick="zeigeAnsicht('rechner')">Rechner</button>
    <button type="button" class="nav-tab" data-ansicht="verlauf" onclick="zeigeAnsicht('verlauf')">Verlauf</button>
    <button type="button" class="nav-tab" data-ansicht="vergleich" onclick="zeigeAnsicht('vergleich')">Vergleich</button>
  </nav>
  <div class="topnav-aktionen">
    <button type="button" class="btn-text" onclick="zeigeGastCode()">Zugangscode</button>
    <button type="button" class="btn-text" onclick="setzeGastCode()">Anderen Code verwenden</button>
  </div>
</header>

<div class="seiten-grid">

  <div id="ansichtRechner">
    <div class="rechner-grid">

      <div class="karte-breit rechner-formular-spalte">
        <div class="karte-titel" id="formTitel">Rendite-Rechner</div>
        <form id="renditeForm">

          <div class="spalten-titel">Objekt</div>

          <div class="objekt-auswahl-zeile">
            <select id="objektAuswahl">
              <option value="neu">+ Neues Objekt</option>
            </select>
            <button type="button" class="btn-bearbeiten-toggle" id="bearbeitenToggleBtn" hidden onclick="bearbeitenToggle()">Bearbeiten</button>
            <button type="button" class="btn-loeschen-icon" id="loeschenObjektBtn" hidden title="Objekt löschen" onclick="loescheAusgewaehltesObjekt()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M10 11v6"></path>
                <path d="M14 11v6"></path>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
              </svg>
            </button>
          </div>
          <div class="param-zeile">
            <label><span class="feld-label">Bezeichnung</span>
              <input type="text" id="objBezeichnung" required />
            </label>
            <label><span class="feld-label">Ort</span>
              <input type="text" id="objOrt" placeholder="z.B. München" maxlength="80" />
            </label>
            <label><span class="feld-label">Kaufpreis (€)</span>
              <input type="text" inputmode="numeric" id="objKaufpreis" required />
            </label>
            <label><span class="feld-label">Wohnfläche (m²)</span>
              <input type="text" inputmode="numeric" id="objWohnflaeche" />
            </label>
            <label><span class="feld-label">Kaltmiete monatlich (€)</span>
              <input type="text" inputmode="numeric" id="objKaltmiete" required />
            </label>
          </div>

          <div class="spalten-titel" style="margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--border);">Finanzierung</div>
          <div class="param-zeile">
            <label><span class="feld-label">Eigenkapital (€)</span>
              <input type="text" inputmode="numeric" id="eigenkapital" required />
            </label>
            <label><span class="feld-label">Zinssatz (%)</span>
              <input type="text" inputmode="decimal" id="zinssatz" required />
            </label>
            <label><span class="feld-label">Tilgungssatz (%)</span>
              <input type="text" inputmode="decimal" id="tilgungssatz" required />
            </label>
            <label><span class="feld-label">Gebäudeanteil (%)</span>
              <input type="text" inputmode="decimal" id="gebaeudeanteil" value="80" min="0" max="100" />
            </label>
            <label><span class="feld-label">Steuersatz (%)</span>
              <input type="text" inputmode="decimal" id="steuersatz" value="0" min="0" max="50" />
            </label>
          </div>
          <div class="regler-zeile">
            <div>
              <label><span class="regler-titel">Kaufnebenkosten: <span id="knkWert">10</span> %</span>
                <small>Grunderwerbsteuer, Notar, Makler zusammen</small>
                <input type="range" id="kaufnebenkosten" min="5" max="15" step="0.5" value="10" />
              </label>
            </div>
            <div>
              <label><span class="regler-titel">AfA-Satz: <span id="afaWert">2</span> %</span>
                <small>Jährliche Gebäudeabschreibung</small>
                <input type="range" id="afa" min="2" max="10" step="0.5" value="2" />
              </label>
            </div>
            <div>
              <label><span class="regler-titel">Bewirtschaftungskosten: <span id="bwkWert">20</span> %</span>
                <small>Verwaltung, Instandhaltung, Mietausfall (nicht umlagefähig)</small>
                <input type="range" id="bewirtschaftungskosten" min="0" max="35" step="1" value="20" />
              </label>
            </div>
          </div>

          <div class="spalten-titel" style="margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--border);">Mehrjahresprognose</div>
          <div class="regler-zeile">
            <div>
              <label><span class="regler-titel">Haltedauer: <span id="haltedauerWert">10</span> Jahre</span>
                <small>Betrachtungszeitraum bis zum angenommenen Verkauf</small>
                <input type="range" id="haltedauer" min="1" max="30" step="1" value="10" />
              </label>
            </div>
            <div>
              <label><span class="regler-titel">Wertsteigerung: <span id="wertsteigerungWert">2</span> % p.a.</span>
                <small>Angenommene jährliche Steigerung des Immobilienwerts</small>
                <input type="range" id="wertsteigerung" min="0" max="6" step="0.25" value="2" />
              </label>
            </div>
            <div>
              <label><span class="regler-titel">Mietsteigerung: <span id="mietsteigerungWert">1.5</span> % p.a.</span>
                <small>Angenommene jährliche Steigerung der Kaltmiete</small>
                <input type="range" id="mietsteigerung" min="0" max="5" step="0.25" value="1.5" />
              </label>
            </div>
            <div>
              <label><span class="regler-titel">Verkaufskosten: <span id="verkaufskostenWert">0</span> %</span>
                <small>Nebenkosten beim Verkauf (z.B. Makler), % vom Verkaufspreis</small>
                <input type="range" id="verkaufskosten" min="0" max="8" step="0.5" value="0" />
              </label>
            </div>
          </div>

          <button type="submit" id="formSubmitBtn">Rendite berechnen</button>
        </form>
      </div>

      <div class="live-vorschau">
        <div class="live-vorschau-kopf">
          <span class="live-punkt"></span>
          Live-Vorschau · aktualisiert automatisch
        </div>
        <p id="liveVorschauLeer" class="leer-hinweis">Kaufpreis und Kaltmiete eingeben, um eine Vorschau zu sehen.</p>
        <div id="liveVorschauKacheln" class="kennzahl-kacheln kennzahl-kacheln--vorschau"></div>
        <p id="liveVorschauHinweis" class="live-vorschau-hinweis" hidden>Die KI-Einschätzung erscheint nach dem Speichern.</p>
      </div>

    </div>
  </div>

  <div id="ansichtVerlauf" hidden>
    <div class="verlauf-titel">Verlauf</div>
    <div id="verlaufFilterChips" class="filter-chips"></div>
    <div id="verlaufListe"></div>
    <p id="verlaufLeer" class="leer-hinweis" hidden>Noch keine Berechnung gespeichert.</p>
    <div id="vergleichsleiste" class="vergleichsleiste" hidden>
      <span><span id="vergleichsAnzahl">0</span> ausgewählt (max. 3)</span>
      <button type="button" onclick="zeigeVergleich()">Vergleichen</button>
    </div>
  </div>

  <div id="ansichtErgebnis" class="inhalt-karte" hidden>
    <button class="link-zurueck" id="zurueckButton">← Zurück</button>
    <div id="ergebnisInhalt"></div>
  </div>

  <div id="ansichtVergleich" class="inhalt-karte" hidden>
    <button class="link-zurueck" id="zurueckButtonVergleich">← Zurück</button>
    <div class="verlauf-titel">Vergleich</div>
    <div id="vergleichInhalt"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
